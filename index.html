<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Free Inventory</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The brand font is Garet (Book to Bold). It is used when installed; Plus Jakarta Sans is the free stand-in with the same geometric shapes. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  /* Atlas Free Brand Book 2025: bold blue, black and white text, lots of white space; supporting colours only as small pops, never for text. */
  :root {
    --blue: #2954FF;
    --blue-dark: #1C3FD9;
    --blue-soft: #EBEFFF;
    --ink: #111111;
    --muted: #5A5D66;
    --line: #E3E5EC;
    --surface: #F5F6FA;
    --white: #FFFFFF;
    --sky: #74C5E7;
    --green: #009963;
    --green-soft: #E2F4EC;
    --yellow: #FFCC29;
    --yellow-soft: #FFF4D1;
    --red: #C8102E;          /* functional only: delete and errors */
    --red-soft: #FCE8EB;
    --radius: 14px;
    --font: Garet, 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--white);
    color: var(--ink);
    font: 400 16px/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-weight: 700; line-height: 1.3; margin: 0; }
  h1 { font-size: 26px; }
  h3 { font-size: 16px; }
  /* Section titles: Garet Bold all caps with 300 tracking, in blue. */
  h2, .caps { font-size: 13px; text-transform: uppercase; letter-spacing: .3em; color: var(--blue); }
  p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }

  .topbar { background: var(--white); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1040px; margin: 0 auto; padding-block: 14px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .brand img { height: 26px; width: auto; display: block; }
  .brand span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3em; color: var(--ink); border-left: 1px solid var(--line); padding-left: 12px; }
  .who { font-size: 13px; text-align: right; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; line-height: 1.4; }
  .who button { background: none; border: 0; color: var(--blue); text-decoration: underline; padding: 0; cursor: pointer; font-size: 13px; font-weight: 500; }
  .tabs { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; overflow-x: auto; }
  .tab { background: none; border: 0; color: var(--muted); padding: 12px 4px 10px; margin-right: 16px; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .3em; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--blue); border-bottom-color: var(--blue); }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 11px; letter-spacing: 0; text-align: center; margin-left: 2px; }

  main { max-width: 1040px; margin: 0 auto; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .dialog-back { position: fixed; inset: 0; background: rgba(17,17,17,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .dialog { background: var(--white); border-radius: var(--radius); padding: 24px; max-width: 420px; width: 100%; }
  .photo-btn { position: relative; overflow: hidden; }
  .photo-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .stack > * + * { margin-top: 16px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .lead { line-height: 1.7; }
  .sample { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3em; color: var(--ink); background: var(--yellow-soft); border-radius: 999px; padding: 3px 10px 3px calc(10px + .3em); }

  /* Buttons: Garet Bold all caps, 300 tracking. Extra left padding balances the tracking after the last letter. */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 18px 12px calc(18px + .3em); border-radius: 10px; border: 2px solid var(--blue); background: var(--blue); color: #fff; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .3em; line-height: 1.3; text-align: center; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
  .btn.ghost { background: transparent; color: var(--blue); }
  .btn.ghost:hover { background: var(--blue-soft); }
  .btn.danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn.danger:hover { background: var(--red-soft); }
  .btn.sm { min-height: 40px; padding: 8px 12px 8px calc(12px + .3em); font-size: 11px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-xl { min-height: 76px; font-size: 16px; border-radius: var(--radius); }
  .link { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; cursor: pointer; font-weight: 700; font-size: 15px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1; min-width: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }

  label, legend { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; padding: 0; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=search], input[type=date], select {
    width: 100%; min-height: 48px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px; background: #fff;
  }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--blue); margin: 0; flex: none; }
  input:focus, select:focus, .btn:focus-visible, .tab:focus-visible, .choice:focus-visible, summary:focus-visible, .link:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-color: var(--blue); }
  .error { color: var(--red); font-size: 14px; font-weight: 700; }
  .error:empty { display: none; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
  .choice { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 18px 16px; cursor: pointer; line-height: 1.4; }
  .choice:hover { border-color: var(--blue); }
  .choice strong { display: block; font-size: 17px; margin-bottom: 2px; }
  .choice span { color: var(--muted); font-size: 14px; }

  .items { list-style: none; margin: 0; padding: 0; }
  .items > li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); line-height: 1.4; }
  .items > li:first-child { border-top: 0; }
  .items .name { font-weight: 700; }
  .qty { font-weight: 700; font-size: 20px; text-align: right; min-width: 48px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; border-radius: 999px; padding: 2px 10px; color: var(--ink); line-height: 1.6; white-space: nowrap; }
  .pill.out { background: var(--blue-soft); }
  .pill.in { background: var(--green-soft); }
  .pill.warn { background: var(--yellow-soft); }
  .pill.zero { background: var(--red-soft); }
  .pill.grey { background: var(--surface); color: var(--muted); }

  /* Inventory grid: photo, name, number, then a collapsible list of sizes. */
  .grid { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
  .tile { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #fff; min-width: 0; }
  .ph { aspect-ratio: 1; background: var(--surface); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph img.mark { width: 34%; height: auto; opacity: .16; object-fit: contain; }
  .tile-body { padding: 12px 12px 4px; line-height: 1.35; }
  .tname { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .tnum { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tile details { border-top: 1px solid var(--line); margin-top: 10px; }
  .tile summary { list-style: none; display: flex; align-items: center; gap: 6px; min-height: 44px; cursor: pointer; font-size: 13px; font-weight: 700; }
  .tile summary::-webkit-details-marker { display: none; }
  .tile summary .chev { margin-left: auto; width: 18px; height: 18px; flex: none; transition: transform 150ms ease; color: var(--blue); }
  .tile details[open] .chev { transform: rotate(180deg); }
  .sizelist { list-style: none; margin: 0 0 6px; padding: 0; font-size: 14px; }
  .sizelist li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--line); }
  .sizelist li.none { color: var(--muted); }
  .tile .loc { font-size: 13px; color: var(--muted); padding-bottom: 10px; }

  .thumb { width: 56px; height: 56px; border-radius: 10px; flex: none; }
  .thumb img.mark { width: 50%; }

  .flowchip { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--blue-soft); color: var(--ink); font-weight: 700; font-size: 13px; border-radius: 999px; padding: 6px 14px; line-height: 1.4; }
  #reader { width: 100%; max-width: 420px; margin: 0 auto; border-radius: var(--radius); overflow: hidden; background: #000; min-height: 240px; }
  #reader video { display: block; }
  .stepper { display: flex; align-items: stretch; gap: 8px; max-width: 240px; }
  .stepper button { width: 52px; min-height: 52px; border-radius: 10px; border: 2px solid var(--blue); background: #fff; color: var(--blue); font-size: 24px; font-weight: 700; cursor: pointer; flex: none; }
  .stepper button:disabled { opacity: .35; cursor: not-allowed; }
  .stepper input { text-align: center; font-size: 20px; font-weight: 700; min-height: 52px; min-width: 0; }
  .sizeqty > li { flex-wrap: wrap; }
  .sizeqty .stepper { width: 196px; flex: none; }
  @media (max-width: 600px) { .who .email { display: none; } }
  /* Admin items: photo, details, total; Edit and Delete under the details on phones. */
  .adm > li { display: grid; grid-template-columns: 56px 1fr auto; gap: 4px 12px; align-items: center; }
  .adm .acts { grid-column: 2 / -1; display: flex; gap: 8px; }
  @media (min-width: 700px) { .adm > li { grid-template-columns: 56px 1fr auto auto; } .adm .acts { grid-column: auto; } }
  .back { margin-bottom: 4px; }

  /* Admin item form: size checkboxes with a quantity beside each checked size. */
  .sizegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  @media (max-width: 520px) { .sizegrid { grid-template-columns: 1fr 1fr; } }
  .sz { border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .sz.on { border-color: var(--blue); background: var(--blue-soft); }
  .sz label { display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; flex: 1; min-width: 0; font-size: 15px; }
  .sz input[type=number] { min-height: 38px; width: 68px; padding: 6px 8px; text-align: center; flex: none; }
  .orow { display: grid; grid-template-columns: 1fr 88px auto; gap: 8px; align-items: center; }
  .photo-edit { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; }
  @media (max-width: 520px) { .photo-edit { grid-template-columns: 110px 1fr; } }
  .photo-edit .ph { border-radius: 12px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 500; max-width: calc(100% - 32px); z-index: 30; line-height: 1.4; }
  .txlines { margin: 6px 0 0; padding-left: 18px; line-height: 1.5; }

  .labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .label { background: #fff; border: 1px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; break-inside: avoid; line-height: 1.35; }
  .label img { width: 120px; height: 120px; image-rendering: pixelated; }
  .label .lname { font-weight: 700; font-size: 14px; }
  .label .lcode { font-size: 12px; color: var(--muted); }
  @media print {
    .topbar, .noprint, .toast { display: none !important; }
    main { padding: 0; }
    .label { border: 1px solid #ccc; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="fileReader" hidden></div>
<script>
// Atlas Free Inventory. Data lives in Supabase and is shared by the whole team; the access rules are in supabase/*.sql.
const SUPABASE_URL = 'https://carcpunahdjefmbgyxfc.supabase.co';
// The publishable key is made to sit in a web page; the database rules decide what each person may do.
const SUPABASE_KEY = 'sb_publishable_hCqGc_Je1kH7ETqB2iatLg_I8mP-i6h';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const PHOTOS = 'item-photos';
const TYPES = {
  general: { label: 'General checkout', hint: 'Everyday use, office or outreach' },
  event:   { label: 'Specific event', hint: 'Items for an event campaign' },
  donor:   { label: 'Donor gift', hint: 'A gift for a named donor' },
  merch:   { label: 'Merch', hint: 'Shirts, totes and other merch' },
};
const SIZES = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
const NOT_TEAM = 'This email isn\'t on the team yet. Ask an admin to add you in Admin › People.';
const CHEVRON = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

const emptyDb = () => ({ items: [], stock: {}, events: [], requests: [], tx: [], members: [], session: null });
let db = emptyDb();
let view = 'loading';
let loginMode = 'signin';   // 'signin' | 'signup' (first time: choose a password)
let adminTab = 'activity';
let flow = null;      // { dir: 'out'|'in', type, eventId, donor, lines: [{itemId, size, qty, donor}], current: {itemId, donor} }
let lastTx = null;
let form = null;      // the admin's item being added or edited: { id, photoPath, newPhoto, preview, removePhoto }
let search = '';
let actFilter = { dir: '', type: '', q: '' };
let scanner = null;
let handling = false;
let busy = false;
const photoUrls = {};  // photo path -> { url, until } (signed links, the bucket is private)

async function loadAll() {
  const res = await Promise.all([
    sb.from('items').select('*').order('id'),
    sb.from('item_stock').select('*'),
    sb.from('events').select('*').order('id'),
    sb.from('event_requests').select('*').order('id'),
    sb.from('transactions').select('*, transaction_lines(*)').order('id'),
    sb.from('members').select('*').order('added_at'),
  ]);
  const bad = res.find((r) => r.error); if (bad) throw bad.error;
  const [items, stock, events, requests, tx, members] = res.map((r) => r.data);
  db.items = items.map((i) => ({ id: String(i.id), code: i.code, name: i.name, location: i.location, qty: i.qty, photo: i.photo_path || '', deleted: i.deleted }));
  db.stock = {};
  for (const s of stock.sort((a, b) => a.sort - b.sort || sizeRank(a.size) - sizeRank(b.size))) (db.stock[String(s.item_id)] ||= []).push({ size: s.size, qty: s.qty });
  db.events = events.map((e) => ({ id: String(e.id), name: e.name, date: e.event_date || '', status: e.status, closeRequestedBy: e.close_requested_by }));
  db.requests = requests.map((r) => ({ id: String(r.id), name: r.name, date: r.event_date || '', by: r.requested_by, at: r.created_at }));
  db.tx = tx.map((t) => ({ id: String(t.id), dir: t.dir, type: t.type, eventId: t.event_id ? String(t.event_id) : null, donor: t.donor, user: t.user_email, at: t.created_at,
    lines: t.transaction_lines.sort((a, b) => a.id - b.id).map((l) => ({ itemId: String(l.item_id), size: l.size || '', qty: l.qty, donor: l.donor })) }));
  db.members = members.map((m) => ({ email: m.email, admin: m.is_admin }));
  loadPhotos();
}
// Fetches signed links for photos not yet linked (or about to expire), then redraws the pictures.
async function loadPhotos() {
  const now = Date.now();
  const paths = [...new Set(db.items.filter((i) => i.photo && !(photoUrls[i.photo]?.until > now + 60e3)).map((i) => i.photo))];
  if (!paths.length) return;
  const { data, error } = await sb.storage.from(PHOTOS).createSignedUrls(paths, 3600);
  if (error || !data) return;
  for (const d of data) if (d.signedUrl) photoUrls[d.path] = { url: d.signedUrl, until: now + 3600e3 };
  if (view === 'home') renderList();
  else if (view === 'admin' && adminTab === 'items') render();
}
// The database's own messages (stock, last admin, closed event) are written for people; anything else gets a plain wrapper.
function errText(e) {
  const m = e?.message || '';
  if (e?.code === 'P0001') return m;
  if (e?.code === '23505') return 'That already exists.';
  if (/fetch|network|load failed/i.test(m)) return 'No connection. Check your internet and try again.';
  return 'That didn\'t save: ' + m;
}
// Sends one change, then reloads so this screen shows what the whole team sees.
// Changes end in .select(): no rows back means the access rules refused it.
async function change(request, okMsg) {
  const { data, error } = await request;
  const refused = !error && Array.isArray(data) && data.length === 0;
  if (error) toast(errText(error)); else if (refused) toast('You don\'t have permission to do that.'); else if (okMsg) toast(okMsg);
  await refresh();
  return !error && !refused;
}
async function refresh() {
  try { await loadAll(); } catch (e) { toast(errText(e)); return; }
  if (db.session && !member(db.session)) { signOut(NOT_TEAM); return; }
  // Only redraw screens that show shared data; the check-out screens and the item form keep what the person is typing.
  if (['home', 'admin', 'event', 'success', 'labels'].includes(view)) render();
}

const $ = (id) => document.getElementById(id);
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const item = (id) => db.items.find((i) => i.id === id);
// Deleted items stay in db.items (marked deleted) so past check-outs still name them.
const active = () => db.items.filter((i) => !i.deleted);
const itemName = (id) => { const i = item(id); return i ? i.name + (i.deleted ? ' (deleted)' : '') : 'Unknown item'; };
const lineName = (id, size) => itemName(id) + (size ? ` (${size})` : '');
const sizeRank = (s) => { const i = SIZES.indexOf(s); return i < 0 ? 99 : i; };
// An item's stock rows; one row with size '' means it comes in one size.
const stockOf = (id) => db.stock[id] || [{ size: '', qty: item(id)?.qty || 0 }];
const sized = (id) => stockOf(id).some((s) => s.size);
const stockQty = (id, size) => stockOf(id).find((s) => s.size === size)?.qty || 0;
const ev = (id) => db.events.find((e) => e.id === id);
const member = (email) => db.members.find((m) => m.email === email);
const isAdmin = () => !!member(db.session)?.admin;
const adminCount = () => db.members.filter((m) => m.admin).length;
const validEmail = (e) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
const fmtDate = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
// Item numbers are numbers only. Old labels say AF-0003: the prefix and leading zeros are ignored when matching.
const normCode = (s) => String(s).trim().toLowerCase().replace(/^af-/, '').replace(/^0+(?=\d)/, '');
const nextNumber = () => String(db.items.reduce((m, i) => Math.max(m, /^\d+$/.test(i.code) ? Number(i.code) : 0), 0) + 1);
function photoBox(it, cls = '') {
  const url = it?.photo && photoUrls[it.photo]?.url;
  return `<div class="ph ${cls}">${url ? `<img src="${h(url)}" alt="" loading="lazy">` : '<img class="mark" src="mark.svg" alt="">'}</div>`;
}

// In-page yes/no box (the claude.ai viewer blocks the browser's confirm()).
// opts.html: extra content under the question (already escaped); opts.cancel: label of the no button.
function ask(msg, okLabel, opts = {}) {
  return new Promise((resolve) => {
    const back = document.createElement('div'); back.className = 'dialog-back';
    back.innerHTML = `<div class="dialog stack" role="dialog" aria-modal="true"><p class="lead">${h(msg)}</p>${opts.html || ''}
      <div class="two"><button class="btn ghost" data-v="0">${h(opts.cancel || 'Keep going')}</button><button class="btn ${opts.danger ? 'danger' : ''}" data-v="1">${h(okLabel)}</button></div></div>`;
    back.addEventListener('click', (e) => {
      const v = e.target.closest('[data-v]'); if (!v && e.target !== back) return;
      back.remove(); resolve(!!v && v.dataset.v === '1');
    });
    document.body.appendChild(back); back.querySelector('[data-v="1"]').focus();
  });
}
// Saves a file: through the viewer's downloads on claude.ai, or a plain download when opened as a file.
async function saveFile(filename, data, type) {
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data }); } catch (e) { if (e?.code !== 'declined') toast('Could not save the file here.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function toast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

async function stopScanner() {
  if (!scanner) return;
  try { if (scanner.isScanning) await scanner.stop(); scanner.clear(); } catch (e) {}
  scanner = null;
}
async function go(v) {
  await stopScanner();
  view = v; render(); window.scrollTo(0, 0);
  if (v === 'scan') startScanner();
  if (v === 'home' || v === 'admin' || v === 'event') refresh();   // pick up what teammates changed
}

// What is still out for an event, per item and size: { 'itemId|size': count }.
function eventOutstanding(eventId) {
  const m = {};
  for (const t of db.tx) if (t.type === 'event' && t.eventId === eventId)
    for (const l of t.lines) { const k = l.itemId + '|' + l.size; m[k] = (m[k] || 0) + (t.dir === 'out' ? l.qty : -l.qty); }
  return m;
}
const keyName = (k) => { const [id, size] = k.split('|'); return lineName(id, size); };
function eventAllBack(eventId) {
  const hadOut = db.tx.some((t) => t.type === 'event' && t.eventId === eventId && t.dir === 'out');
  return hadOut && Object.values(eventOutstanding(eventId)).every((n) => n <= 0);
}

// Quantity for one size: what's left to take out (stock minus what's already in this checkout).
function available(it, size) {
  const inCart = flow.lines.filter((l) => l.itemId === it.id && l.size === size).reduce((s, l) => s + l.qty, 0);
  return { stock: stockQty(it.id, size), inCart, left: stockQty(it.id, size) - inCart };
}
function vItem() {
  if (!flow?.current) return `<p class="muted">Saving…</p>`;   // between "Done" and the saved receipt
  const c = flow.current, it = item(c.itemId), out = flow.dir === 'out';
  const owed = flow.type === 'event' && !out ? eventOutstanding(flow.eventId) : null;
  const note = (size) => {
    const a = available(it, size);
    let n = `${a.stock} in stock`;
    if (out && a.inCart) n += ` · ${a.inCart} already in this checkout`;
    if (owed) n += ` · ${Math.max(owed[it.id + '|' + size] || 0, 0)} still out for this event`;
    return n;
  };
  const stepper = (idx, size, value, min) => {
    const max = out ? available(it, size).left : '';
    return `<div class="stepper">
      <button type="button" onclick="bump(${idx},-1,${min})" aria-label="One less${size ? ' ' + h(size) : ''}">−</button>
      <input id="q${idx}" data-size="${h(size)}" type="number" inputmode="numeric" min="${min}" ${max !== '' ? `max="${max}"` : ''} value="${value}" aria-label="Quantity${size ? ' in size ' + h(size) : ''}">
      <button type="button" onclick="bump(${idx},1,${min})" aria-label="One more${size ? ' ' + h(size) : ''}">+</button>
    </div>`;
  };
  const rows = stockOf(it.id).filter((s) => s.size);
  const qtyBlock = rows.length
    ? `<fieldset><legend>How many of each size?</legend>
        <ul class="items sizeqty">${rows.map((s, idx) => {
          const none = out && available(it, s.size).left <= 0;
          return `<li><div class="grow"><div class="name">${h(s.size)}</div><div class="small muted">${note(s.size)}</div></div>
            ${none ? '<span class="pill zero">None left</span>' : stepper(idx, s.size, 0, 0)}</li>`;
        }).join('')}</ul></fieldset>`
    : `<div><label for="q0">How many are you ${verb()}?</label><p class="small muted" style="margin-bottom:8px">${note('')}</p>${stepper(0, '', 1, 1)}</div>`;
  return `<div class="stack">
    <div class="row"><div class="grow">${flowChip()}</div><button class="link" onclick="go('scan')">Cancel item</button></div>
    <div class="card stack">
      <div class="row" style="flex-wrap:nowrap">${photoBox(it, 'thumb')}<div class="grow"><span class="small muted">Item #${h(it.code)}${it.location ? ' · ' + h(it.location) : ''}</span><h1 style="font-size:22px">${h(it.name)}</h1></div></div>
      ${qtyBlock}
      ${flow.type === 'donor' ? `<div><label for="lineDonor">Donor this item is for</label><input id="lineDonor" type="text" value="${h(c.donor)}"></div>` : ''}
      <div id="itemErr" class="error" role="alert"></div>
      <div class="two">
        <button class="btn ghost block" onclick="addLine(false)">Scan another</button>
        <button class="btn block" onclick="addLine(true)">Done</button>
      </div>
    </div>
    ${linesList()}
  </div>`;
}

async function onCode(text) {

function startScanner() {

  scanner = new Html5Qrcode('reader', { verbose: false });
  scanner.start({ facingMode: 'environment' },
    { fps: 10, qrbox: (w, hgt) => { const s = Math.floor(Math.min(w, hgt) * 0.7); return { width: s, height: s }; } },
    (text) => onCode(text), () => {})
    .catch(() => {

    });

async function scanPhoto(input) {

  if (!file) return;
  if (!window.Html5Qrcode) { toast('The scanner didn\'t load. Type the item number instead.'); return; }
  const text = await decodePhoto(file);
  if (text) onCode(text); else toast('No code found in that photo. Fill the frame with the label and try again.');

async function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });
  URL.revokeObjectURL(url);
  return img;
}
// Phone photos are 12+ megapixels and the decoder gives up on them, so try smaller copies and a centre crop.
async function decodePhoto(file) {
  const img = await loadImage(file);
  if (!img) return null;
  const W = img.naturalWidth, H = img.naturalHeight;
  const tries = [[0, 0, W, H, 1200], [W * .2, H * .2, W * .6, H * .6, 1000], [0, 0, W, H, 800], [0, 0, W, H, 1800]];
  const reader = new Html5Qrcode('fileReader', { verbose: false });
  try {
    for (const [sx, sy, sw, sh, max] of tries) {
      const k = Math.min(1, max / Math.max(sw, sh));
      const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      if ('BarcodeDetector' in window) {
        try { const r = await new BarcodeDetector().detect(c); if (r[0]) return r[0].rawValue; } catch (e) {}
      }
      const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
      try { return await reader.scanFile(new File([blob], 'scan.png', { type: 'image/png' }), false); } catch (e) {}
    }
    return null;
  } finally { try { reader.clear(); } catch (e) {} }
}
function bump(idx, d, min) {
  const i = $('q' + idx);
  let v = Math.max(min, (parseInt(i.value, 10) || 0) + d);
  if (i.max !== '') v = Math.min(v, Number(i.max));
  i.value = v;
}
function addLine(finish) {
  const c = flow.current, it = item(c.itemId);
  const err = (m) => { $('itemErr').textContent = m; };
  const picks = [...document.querySelectorAll('main .stepper input')].map((i) => ({ size: i.dataset.size, qty: parseInt(i.value, 10) || 0 }));
  const wanted = picks.filter((p) => p.qty > 0);
  if (picks.some((p) => p.qty < 0)) return err('Quantities can\'t be below 0.');
  if (!wanted.length) return err(sized(it.id) ? 'Enter how many for at least one size.' : 'Enter a quantity of 1 or more.');
  const donor = flow.type === 'donor' ? $('lineDonor').value.trim() : '';
  if (flow.type === 'donor' && !donor) return err('Enter the donor this item is for.');
  if (flow.dir === 'out') {
    const over = wanted.find((p) => p.qty > available(it, p.size).left);
    if (over) return err(`Only ${available(it, over.size).left} left${over.size ? ' in size ' + over.size : ''}.`);
  }
  for (const p of wanted) {
    const same = flow.lines.find((l) => l.itemId === it.id && l.size === p.size && l.donor === donor);
    if (same) same.qty += p.qty; else flow.lines.push({ itemId: it.id, size: p.size, qty: p.qty, donor });
  }
  flow.current = null;
  if (finish) complete(); else go('scan');
}
function removeLine(idx) { flow.lines.splice(idx, 1); render(); if (view === 'scan') { stopScanner().then(startScanner); } }
async function complete() {
  if (!flow.lines.length) { toast('Scan at least one item first.'); return; }
  if (busy) return;   // a double tap on Done must not record the checkout twice
  busy = true;
  const { data: txId, error } = await sb.rpc('record_transaction', {
    p_dir: flow.dir, p_type: flow.type, p_event_id: flow.eventId ? Number(flow.eventId) : null, p_donor: flow.donor || '',
    p_lines: flow.lines.map((l) => ({ item_id: Number(l.itemId), size: l.size, qty: l.qty, donor: l.donor })),
  });
  busy = false;
  if (error) {
    try { await loadAll(); } catch (e) {}
    await go('scan');   // nothing was saved; the list is still there to fix
    toast(errText(error));
    return;
  }
  const local = { id: String(txId), dir: flow.dir, type: flow.type, eventId: flow.eventId, donor: flow.donor || '', user: db.session, at: new Date().toISOString(), lines: flow.lines.map((l) => ({ ...l })) };
  try { await loadAll(); } catch (e) {}
  lastTx = db.tx.find((t) => t.id === String(txId)) || local;
  flow = null; go('success');
}

// Phone photos are several MB; a 1000px JPEG keeps the grid quick and the free storage roomy.
async function pickItemPhoto(input) {
  const file = input.files && input.files[0]; input.value = '';
  if (!file) return;
  const img = await loadImage(file);
  if (!img) { toast('That file isn\'t a photo this browser can open. Try a JPEG or PNG.'); return; }
  const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
  if (form.preview) URL.revokeObjectURL(form.preview);
  form.newPhoto = blob; form.preview = URL.createObjectURL(blob); form.removePhoto = false;
  keepFormAndRender();
}
function removeItemPhoto() {
  if (form.preview) URL.revokeObjectURL(form.preview);
  form.newPhoto = null; form.preview = null; form.removePhoto = true;
  keepFormAndRender();

function keepFormAndRender() {

  const url = form.preview || (!form.removePhoto && it?.photo && photoUrls[it.photo]?.url);
  $('fiPhoto').innerHTML = url ? `<img src="${h(url)}" alt="Photo of the item">` : '<img class="mark" src="mark.svg" alt="">';
  const box = $('fiPhoto').nextElementSibling, rm = box.querySelector('.link');

function readStock() {
  const stock = [];
  for (const chk of document.querySelectorAll('#sizeGrid input[data-size]')) {
    if (!chk.checked) continue;
    stock.push({ size: chk.dataset.size, qty: chk.closest('.sz').querySelector('input[type=number]').value });
  }
  if ($('otherChk').checked) for (const r of document.querySelectorAll('#otherRows .orow')) {
    const name = r.querySelector('.oname').value.trim(), qty = r.querySelector('.oqty').value;
    if (!name && !(parseInt(qty, 10) > 0)) continue;   // an empty row is ignored
    stock.push({ size: SIZES.find((s) => s.toLowerCase() === name.toLowerCase()) || name, qty });
  }
  if (!stock.length) stock.push({ size: '', qty: $('fiQty').value });
  return stock.map((s) => ({ size: s.size, qty: s.qty === '' ? NaN : Number(s.qty) }));
}
async function saveItemForm() {
  if (busy) return;
  const err = (m) => { $('fiErr').textContent = m; return false; };
  const it = form.id ? item(form.id) : null;
  const name = $('fiName').value.trim(), code = $('fiCode').value.trim(), location = $('fiLoc').value.trim();
  const stock = readStock();
  if (!name) return err('Give the item a name.');
  if (!/^\d+$/.test(code)) return err('The item number can only have numbers.');
  const taken = db.items.find((i) => i.id !== form.id && normCode(i.code) === normCode(code));
  if (taken) return err(`Item number ${code} is already used${taken.deleted ? ' by a deleted item' : ' by ' + taken.name}.`);
  if (stock.some((s) => !s.size && stock.length > 1)) return err('Every size needs a name.');
  if (stock.some((s) => !Number.isInteger(s.qty) || s.qty < 0)) return err('Quantities must be whole numbers, 0 or more.');
  const names = stock.map((s) => s.size.toLowerCase());
  if (new Set(names).size !== names.length) return err('Each size can only be listed once.');
  if (it) {
    const gone = stockOf(it.id).filter((s) => s.qty > 0 && !stock.some((n) => n.size === s.size));
    if (gone.length && !(await ask(`Remove ${gone.map((s) => `${s.qty} × ${s.size || 'one size'}`).join(', ')} from the inventory? These sizes are no longer on the item.`, 'Remove them', { cancel: 'Go back' }))) return;
  }
  busy = true; $('fiSave').disabled = true; $('fiSave').textContent = 'Saving…'; err('');
  const done = () => { busy = false; if ($('fiSave')) { $('fiSave').disabled = false; $('fiSave').textContent = it ? 'Save changes' : 'Add item'; } };
  let photo = it?.photo || '';
  let uploaded = '';
  if (form.newPhoto) {
    uploaded = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}.jpg`;
    const { error } = await sb.storage.from(PHOTOS).upload(uploaded, form.newPhoto, { contentType: 'image/jpeg' });
    if (error) { done(); return err('The photo didn\'t upload: ' + (error.message || 'try again') + '.'); }
    photo = uploaded;
  } else if (form.removePhoto) photo = '';
  const { error } = await sb.rpc('save_item', { p_id: form.id ? Number(form.id) : null, p_code: code, p_name: name, p_location: location, p_photo: photo, p_stock: stock });
  done();
  if (error) {
    if (uploaded) sb.storage.from(PHOTOS).remove([uploaded]);
    return err(errText(error));
  }
  if (it?.photo && it.photo !== photo) sb.storage.from(PHOTOS).remove([it.photo]);   // the old photo is no longer used
  if (form.newPhoto) photoUrls[photo] = { url: form.preview, until: Date.now() + 3600e3 };   // show it right away
  form.preview = null;
  toast(it ? `Saved ${name}.` : `Added ${name} as item #${code}.`);
  form = null; adminTab = 'items'; go('admin');
}
async function deleteItem(id) {

// Deleting an entry undoes its stock change: a check-out's items go back, a check-in's items come out.
async function deleteEntry(id) {
  const t = db.tx.find((x) => x.id === id); if (!t) return;
  const out = t.dir === 'out';
  const per = {};
  for (const l of t.lines) { const k = l.itemId + '|' + l.size; per[k] = (per[k] || 0) + l.qty; }
  const have = (k) => { const [iid, size] = k.split('|'); return stockQty(iid, size); };
  const short = Object.entries(per).find(([k, q]) => !out && have(k) < q);
  if (short) { const [k, q] = short; toast(`Can't delete: this check-in added ${q} ${keyName(k)}, but only ${have(k)} are in stock now.`); return; }
  const rows = Object.entries(per).map(([k, q]) => {
    const now = have(k), after = now + (out ? q : -q);
    return `<li><strong>${out ? '+' : '−'}${q}</strong> ${h(keyName(k))} <span class="muted">(${now} → ${after} in stock)</span></li>`;
  }).join('');
  const ok = await ask(
    out ? `Delete this check-out by ${t.user}? These items go back into inventory:` : `Delete this check-in by ${t.user}? These items come out of inventory:`,
    'Confirm delete',
    { cancel: 'Cancel', danger: true, html: `<ul class="txlines">${rows}</ul><p class="small muted">The entry leaves the history.</p>` });
  if (!ok) return;
  await change(sb.rpc('delete_transaction', { p_id: Number(id) }), out ? 'Deleted. The items are back in inventory.' : 'Deleted. The items came out of inventory.');
}
async function addEvent() {
  const name = $('neName').value.trim(); if (!name) return;
  await change(sb.from('events').insert({ name, event_date: $('neDate').value || null }).select(), `Created ${name}.`);
}
async function approveRequest(id) {
  const r = db.requests.find((x) => x.id === id);
  if (await change(sb.from('events').insert({ name: r.name, event_date: r.date || null }).select(), `Added ${r.name}.`))
    await change(sb.from('event_requests').delete().eq('id', Number(id)).select());
}
async function dismissRequest(id) { await change(sb.from('event_requests').delete().eq('id', Number(id)).select()); }
async function setEvent(id, status) {
  if (status === 'closed') {
    const out = Object.values(eventOutstanding(id)).reduce((s, n) => s + Math.max(n, 0), 0);
    if (out && !(await ask(`${out} item${out === 1 ? ' is' : 's are'} still out for this event. Close it anyway?`, 'Close event'))) return;
  }
  const patch = status === 'open' ? { status, close_requested_by: null } : { status };
  await change(sb.from('events').update(patch).eq('id', Number(id)).select());
}
async function addMember() {
  const email = $('nmEmail').value.trim().toLowerCase(), admin = $('nmAdmin').checked;
  if (!validEmail(email)) { $('nmErr').textContent = 'Enter a valid email address.'; return; }
  if (member(email)) { $('nmErr').textContent = `${email} is already on the team.`; return; }
  await change(sb.from('members').insert({ email, is_admin: admin }).select(), `Added ${email} as ${admin ? 'an admin' : 'a member'}. They can now open the app and tap "Set your password".`);
}
async function setRole(i, role) {
  const m = db.members[i];
  if (role === 'member' && m.admin && adminCount() === 1) { toast('The team needs at least one admin.'); render(); return; }
  if (role === 'member' && m.email === db.session && !(await ask('Remove your own admin access? You won\'t see the Admin area anymore.', 'Remove my access'))) { render(); return; }
  await change(sb.from('members').update({ is_admin: role === 'admin' }).eq('email', m.email).select(), `${m.email} is now ${role === 'admin' ? 'an admin' : 'a member'}.`);
  if (!isAdmin()) go('home');
}
async function removeMember(i) {
  const m = db.members[i];
  if (m.admin && adminCount() === 1) { toast('The team needs at least one admin.'); return; }
  const self = m.email === db.session;
  if (!(await ask(self ? 'Remove yourself from the team? You\'ll be signed out and can\'t sign back in.' : `Remove ${m.email}? They won't be able to sign in. Their past check-outs stay in the history.`, 'Remove', { danger: true }))) return;
  await change(sb.from('members').delete().eq('email', m.email).select(), `Removed ${m.email}.`);
}
function exportCsv() {
  const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date', 'Person', 'Direction', 'Type', 'Event', 'Donor', 'Item', 'Item number', 'Size', 'Quantity']];
  for (const t of db.tx) for (const l of t.lines) {
    const it = item(l.itemId);
    rows.push([t.at, t.user, t.dir === 'out' ? 'Check-out' : 'Check-in', TYPES[t.type].label, t.eventId ? ev(t.eventId)?.name : '', l.donor || t.donor, it?.name, it?.code, l.size || 'One size', l.qty]);
  }
  saveFile('atlas-free-inventory-activity.csv', rows.map((r) => r.map(esc).join(',')).join('\n'), 'text/csv');
}
function downloadLabels() {
  const cells = active().map((i) => `<div class="l"><img src="${qrUrl(i.code)}" alt=""><b>${h(i.name)}</b><span>Item #${h(i.code)}</span></div>`).join('');
  const doc = `<!doctype html><html><head><meta charset="utf-8"><title>Atlas Free QR labels</title><style>
body{font-family:system-ui,sans-serif;margin:16px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.l{border:1px dashed #bbb;border-radius:6px;padding:8px;text-align:center;break-inside:avoid}.l img{width:110px;height:110px;image-rendering:pixelated}
.l b{display:block;font-size:13px}.l span{font-size:11px;color:#555}@media print{.l{border-color:#ddd}}</style></head>
<body><p>Open this file and print it (Cmd+P / Ctrl+P) on sticker paper.</p><div class="g">${cells}</div></body></html>`;
  saveFile('atlas-free-qr-labels.html', doc, 'text/html');
}

boot();
</script>
