<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Free Inventory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root {
    --blue: #3355F0;
    --blue-dark: #2440D6;
    --blue-soft: #E8ECFE;
    --cream: #FAF7F2;
    --card: #FFFFFF;
    --ink: #141414;
    --muted: #5E5A55;
    --line: #E6E1D8;
    --red: #C62E2E;
    --red-soft: #FBE9E9;
    --green: #1E7F4F;
    --green-soft: #E3F4EA;
    --amber: #8A5A00;
    --amber-soft: #FDF1D8;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font: 400 16px/1.5 Figtree, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: Sora, Figtree, system-ui, sans-serif; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: 26px; line-height: 1.2; }
  h2 { font-size: 20px; line-height: 1.25; }
  h3 { font-size: 16px; }
  p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }

  .topbar { background: var(--blue); color: #fff; }
  .topbar-inner { max-width: 960px; margin: 0 auto; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; }
  .brand { font-family: Sora, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.1; flex: 1; min-width: 0; }
  .brand small { display: block; font-family: Figtree, sans-serif; font-weight: 500; font-size: 13px; opacity: .85; }
  .who { font-size: 13px; text-align: right; opacity: .95; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
  .who button { background: none; border: 0; color: #fff; text-decoration: underline; padding: 0; cursor: pointer; font-size: 13px; }
  .tabs { max-width: 960px; margin: 0 auto; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 4px; overflow-x: auto; }
  .tab { background: none; border: 0; color: rgba(255,255,255,.8); padding: 10px 12px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.on { color: #fff; border-bottom-color: #fff; }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: #fff; color: var(--blue); font-size: 12px; text-align: center; margin-left: 4px; }

  main { max-width: 960px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .dialog-back { position: fixed; inset: 0; background: rgba(20,20,20,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .dialog { background: var(--card); border-radius: var(--radius); padding: 20px; max-width: 400px; width: 100%; }
  .photo-btn { position: relative; overflow: hidden; }
  .photo-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .stack > * + * { margin-top: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .sample { display: inline-block; font-size: 12px; font-weight: 600; color: var(--amber); background: var(--amber-soft); border-radius: 999px; padding: 2px 10px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: 10px; border: 2px solid var(--blue); background: var(--blue); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
  .btn.ghost { background: transparent; color: var(--blue); }
  .btn.ghost:hover { background: var(--blue-soft); }
  .btn.danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn.sm { min-height: 40px; padding: 8px 14px; font-size: 14px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-xl { min-height: 72px; font-size: 20px; font-family: Sora, sans-serif; border-radius: 14px; }
  .link { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; cursor: pointer; font-weight: 600; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1; min-width: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }

  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=search], input[type=date], select {
    width: 100%; min-height: 48px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px; background: #fff;
  }
  input:focus, select:focus, .btn:focus-visible, .tab:focus-visible, .choice:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-color: var(--blue); }
  .error { color: var(--red); font-size: 14px; font-weight: 600; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
  .choice { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 18px 16px; cursor: pointer; }
  .choice:hover { border-color: var(--blue); }
  .choice strong { display: block; font-family: Sora, sans-serif; font-size: 17px; }
  .choice span { color: var(--muted); font-size: 14px; }

  .items { list-style: none; margin: 0; padding: 0; }
  .items li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  .items li:first-child { border-top: 0; }
  .items .name { font-weight: 600; }
  .qty { font-family: Sora, sans-serif; font-weight: 700; font-size: 20px; text-align: right; min-width: 56px; }
  .qty small { display: block; font-family: Figtree, sans-serif; font-size: 12px; font-weight: 500; color: var(--muted); }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
  .pill.out { background: var(--blue-soft); color: var(--blue-dark); }
  .pill.in { background: var(--green-soft); color: var(--green); }
  .pill.warn { background: var(--amber-soft); color: var(--amber); }
  .pill.zero { background: var(--red-soft); color: var(--red); }
  .pill.grey { background: #EEE; color: var(--muted); }

  .flowchip { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--blue-soft); color: var(--blue-dark); font-weight: 600; font-size: 14px; border-radius: 999px; padding: 6px 14px; }
  #reader { width: 100%; max-width: 420px; margin: 0 auto; border-radius: var(--radius); overflow: hidden; background: #000; min-height: 240px; }
  #reader video { display: block; }
  .stepper { display: flex; align-items: stretch; gap: 8px; max-width: 260px; }
  .stepper button { width: 56px; min-height: 56px; border-radius: 10px; border: 2px solid var(--blue); background: #fff; color: var(--blue); font-size: 26px; font-weight: 700; cursor: pointer; }
  .stepper input { text-align: center; font-size: 22px; font-weight: 700; min-height: 56px; }
  .back { margin-bottom: 4px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 600; max-width: calc(100% - 32px); z-index: 10; }
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th, .table td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  .table th { border-top: 0; color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; position: relative; }
  @media (max-width: 640px) {
    .items-table thead { display: none; }
    .items-table, .items-table tbody { display: block; }
    .items-table tr { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
    .items-table tr:first-child { border-top: 0; }
    .items-table td { display: block; border: 0; padding: 0; min-width: 0; }
    .items-table td:nth-child(1), .items-table td:nth-child(2) { grid-column: 1 / -1; }
    .items-table td[data-label]::before { content: attr(data-label); display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .items-table input { min-width: 0 !important; width: 100% !important; }
  }
  .txlines { margin: 6px 0 0; padding-left: 18px; }

  .labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .label { background: #fff; border: 1px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; break-inside: avoid; }
  .label img { width: 120px; height: 120px; image-rendering: pixelated; }
  .label .lname { font-weight: 700; font-size: 14px; }
  .label .lcode { font-size: 12px; color: var(--muted); }
  @media print {
    .topbar, .noprint, .toast { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    .label { border: 1px solid #ccc; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="fileReader" hidden></div>
<script>
// Atlas Free Inventory. Data lives in Supabase and is shared by the whole team; the access rules are in supabase/setup.sql.
const SUPABASE_URL = 'https://carcpunahdjefmbgyxfc.supabase.co';
// The publishable key is made to sit in a web page; the database rules decide what each person may do.
const SUPABASE_KEY = 'sb_publishable_hCqGc_Je1kH7ETqB2iatLg_I8mP-i6h';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const TYPES = {
  general: { label: 'General checkout', hint: 'Everyday use, office or outreach' },
  event:   { label: 'Specific event', hint: 'Items for an event campaign' },
  donor:   { label: 'Donor gift', hint: 'A gift for a named donor' },
  merch:   { label: 'Merch', hint: 'Shirts, totes and other merch' },
};
const NOT_TEAM = 'This email is not on the team. Ask an admin to add you in Admin › People.';

const emptyDb = () => ({ items: [], events: [], requests: [], tx: [], members: [], session: null });
let db = emptyDb();
let view = 'loading';
let loginMode = 'signin';   // 'signin' | 'signup' (first time: choose a password)
let adminTab = 'activity';
let flow = null;      // { dir: 'out'|'in', type, eventId, donor, lines: [{itemId, qty, donor}], current }
let lastTx = null;
let search = '';
let actFilter = { dir: '', type: '', q: '' };
let scanner = null;
let handling = false;
let busy = false;

async function loadAll() {
  const res = await Promise.all([
    sb.from('items').select('*').order('id'),
    sb.from('events').select('*').order('id'),
    sb.from('event_requests').select('*').order('id'),
    sb.from('transactions').select('*, transaction_lines(*)').order('id'),
    sb.from('members').select('*').order('added_at'),
  ]);
  const bad = res.find((r) => r.error); if (bad) throw bad.error;
  const [items, events, requests, tx, members] = res.map((r) => r.data);
  db.items = items.map((i) => ({ id: String(i.id), code: i.code, name: i.name, location: i.location, qty: i.qty, deleted: i.deleted }));
  db.events = events.map((e) => ({ id: String(e.id), name: e.name, date: e.event_date || '', status: e.status, closeRequestedBy: e.close_requested_by }));
  db.requests = requests.map((r) => ({ id: String(r.id), name: r.name, date: r.event_date || '', by: r.requested_by, at: r.created_at }));
  db.tx = tx.map((t) => ({ id: String(t.id), dir: t.dir, type: t.type, eventId: t.event_id ? String(t.event_id) : null, donor: t.donor, user: t.user_email, at: t.created_at,
    lines: t.transaction_lines.sort((a, b) => a.id - b.id).map((l) => ({ itemId: String(l.item_id), qty: l.qty, donor: l.donor })) }));
  db.members = members.map((m) => ({ email: m.email, admin: m.is_admin }));
}
// The database's own messages (stock, last admin, closed event) are written for people; anything else gets a plain wrapper.
function errText(e) {
  const m = e?.message || '';
  if (e?.code === 'P0001') return m;
  if (e?.code === '23505') return 'That already exists.';
  if (/fetch|network|load failed/i.test(m)) return 'No connection. Check your internet and try again.';
  return 'That didn\'t save: ' + m;
}
// Sends one change, then reloads so this screen shows what the whole team sees.
// Changes end in .select(): no rows back means the access rules refused it.
async function change(request, okMsg) {
  const { data, error } = await request;
  const refused = !error && Array.isArray(data) && data.length === 0;
  if (error) toast(errText(error)); else if (refused) toast('You don\'t have permission to do that.'); else if (okMsg) toast(okMsg);
  await refresh();
  return !error && !refused;
}
async function refresh() {
  try { await loadAll(); } catch (e) { toast(errText(e)); return; }
  if (db.session && !member(db.session)) { signOut(NOT_TEAM); return; }
  // Only redraw screens that show shared data; the check-out screens keep what the person is typing.
  if (['home', 'admin', 'event', 'success', 'labels'].includes(view)) render();
}

const $ = (id) => document.getElementById(id);
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const item = (id) => db.items.find((i) => i.id === id);
// Deleted items stay in db.items (marked deleted) so past check-outs still name them.
const active = () => db.items.filter((i) => !i.deleted);
const itemName = (id) => { const i = item(id); return i ? i.name + (i.deleted ? ' (deleted)' : '') : 'Unknown item'; };
const ev = (id) => db.events.find((e) => e.id === id);
const member = (email) => db.members.find((m) => m.email === email);
const isAdmin = () => !!member(db.session)?.admin;
const adminCount = () => db.members.filter((m) => m.admin).length;
const validEmail = (e) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
const fmtDate = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });

// In-page yes/no box (the claude.ai viewer blocks the browser's confirm()).
function ask(msg, okLabel) {
  return new Promise((resolve) => {
    const back = document.createElement('div'); back.className = 'dialog-back';
    back.innerHTML = `<div class="dialog stack" role="dialog" aria-modal="true"><p>${h(msg)}</p>
      <div class="two"><button class="btn ghost" data-v="0">Keep going</button><button class="btn" data-v="1">${h(okLabel)}</button></div></div>`;
    back.addEventListener('click', (e) => {
      const v = e.target.closest('[data-v]'); if (!v && e.target !== back) return;
      back.remove(); resolve(!!v && v.dataset.v === '1');
    });
    document.body.appendChild(back); back.querySelector('[data-v="1"]').focus();
  });
}
// Saves a file: through the viewer's downloads on claude.ai, or a plain download when opened as a file.
async function saveFile(filename, data, type) {
  let dl = null;
  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data }); } catch (e) { if (e?.code !== 'declined') toast('Could not save the file here.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function toast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}

async function stopScanner() {
  if (!scanner) return;
  try { if (scanner.isScanning) await scanner.stop(); scanner.clear(); } catch (e) {}
  scanner = null;
}
async function go(v) {
  await stopScanner();
  view = v; render(); window.scrollTo(0, 0);
  if (v === 'scan') startScanner();
  if (v === 'home' || v === 'admin' || v === 'event') refresh();   // pick up what teammates changed
}

function eventOutstanding(eventId) {
  const m = {};
  for (const t of db.tx) if (t.type === 'event' && t.eventId === eventId)
    for (const l of t.lines) m[l.itemId] = (m[l.itemId] || 0) + (t.dir === 'out' ? l.qty : -l.qty);
  return m;
}
function eventAllBack(eventId) {
  const hadOut = db.tx.some((t) => t.type === 'event' && t.eventId === eventId && t.dir === 'out');
  return hadOut && Object.values(eventOutstanding(eventId)).every((n) => n <= 0);
}

// ---------- rendering ----------
function render() {
  const app = $('app');
  if (view === 'login') { app.innerHTML = vLogin(); return; }
  if (view === 'loading') { app.innerHTML = `<header class="topbar"><div class="topbar-inner"><div class="brand">Atlas Free<small>Inventory</small></div></div></header><main><p class="muted">Loading…</p></main>`; return; }
  const pending = db.requests.length + db.events.filter((e) => e.status === 'close_requested').length;
  const tab = view === 'admin' ? 'admin' : 'home';
  app.innerHTML = `
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">Atlas Free<small>Inventory</small></div>
        <div class="who">${h(db.session)}${isAdmin() ? ' · Admin' : ''}<br><button onclick="signOut()">Sign out</button></div>
      </div>
      <nav class="tabs" aria-label="Main">
        <button class="tab ${tab === 'home' ? 'on' : ''}" onclick="flow=null;go('home')">Inventory</button>
        ${isAdmin() ? `<button class="tab ${tab === 'admin' ? 'on' : ''}" onclick="go('admin')">Admin${pending ? `<span class="badge">${pending}</span>` : ''}</button>` : ''}
      </nav>
    </header>
    <main>${({ home: vHome, type: vType, event: vEvent, request: vRequest, donor: vDonor, scan: vScan, item: vItem, success: vSuccess, admin: vAdmin, labels: vLabels })[view]()}</main>`;
}

function vLogin() {
  const up = loginMode === 'signup';
  return `
  <header class="topbar"><div class="topbar-inner"><div class="brand">Atlas Free<small>Inventory</small></div></div></header>
  <main><div class="card stack" style="max-width:440px;margin:24px auto">
    <h1>${up ? 'Set your password' : 'Sign in'}</h1>
    <p class="muted">${up ? 'First time here? Use the email an admin added to the team, then choose a password.' : 'Use your work email. Every check-out and check-in records who did it.'}</p>
    <form onsubmit="event.preventDefault();signIn()" class="stack">
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.org"></div>
      <div><label for="password">${up ? 'Choose a password (8 or more characters)' : 'Password'}</label><input id="password" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" required minlength="8"></div>
      <div id="loginErr" class="error" role="alert"></div>
      <button class="btn block" id="loginBtn" type="submit">${up ? 'Set password and sign in' : 'Sign in'}</button>
    </form>
    <p class="small">${up ? 'Already set a password?' : 'First time here?'} <button class="link" onclick="loginMode='${up ? 'signin' : 'signup'}';render()">${up ? 'Sign in' : 'Set your password'}</button></p>
    <p class="small muted">Only team members added by an admin can sign in. Forgot your password? Ask an admin.</p>
  </div></main>`;
}

function vHome() {
  const q = search.trim().toLowerCase();
  const list = active().filter((i) => !q || (i.name + ' ' + i.location + ' ' + i.code).toLowerCase().includes(q));
  return `<div class="stack">
    <div class="two">
      <button class="btn btn-xl block" onclick="startFlow('out')">Check out</button>
      <button class="btn btn-xl ghost block" onclick="startFlow('in')">Check in</button>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:8px"><h2 class="grow">Inventory</h2><span class="sample">Sample data</span></div>
      <input type="search" id="search" placeholder="Search items or locations" value="${h(search)}" oninput="search=this.value;renderList()" aria-label="Search inventory">
      <ul class="items" id="itemList" style="margin-top:8px">${itemRows(list)}</ul>
    </div>
  </div>`;
}
function itemRows(list) {
  if (!list.length) return `<li class="muted">No items match.</li>`;
  return list.map((i) => `<li>
    <div class="grow"><div class="name">${h(i.name)}</div><div class="small muted">${h(i.location)} · ${h(i.code)}</div></div>
    <div class="qty">${i.qty}<small>${i.qty === 0 ? '<span class="pill zero">Out</span>' : i.qty <= 3 ? '<span class="pill warn">Low</span>' : 'in stock'}</small></div>
  </li>`).join('');
}
function renderList() {
  const q = search.trim().toLowerCase();
  $('itemList').innerHTML = itemRows(active().filter((i) => !q || (i.name + ' ' + i.location + ' ' + i.code).toLowerCase().includes(q)));
}

function verb() { return flow.dir === 'out' ? 'checking out' : 'checking in'; }
function backBtn(to) { return `<button class="link back" onclick="go('${to}')">← Back</button>`; }

function vType() {
  return `<div class="stack">
    ${backBtn('home')}
    <h1>What are you ${verb()}?</h1>

function vItem() {

function qrUrl(text) {
  if (!window.qrcode) return '';
  const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createDataURL(6, 2);
}

// ---------- actions ----------
async function boot() {
  if (!sb) { $('app').innerHTML = '<main><div class="card">Atlas Free Inventory could not load. Check your internet connection and reload the page.</div></main>'; return; }
  const { data } = await sb.auth.getSession();
  if (data.session) await enter(data.session.user.email); else go('login');
}
async function enter(email) {
  db.session = email.toLowerCase();
  try { await loadAll(); } catch (e) { await signOut(errText(e)); return; }
  if (!member(db.session)) { await signOut(NOT_TEAM); return; }
  go('home');
}
async function signIn() {
  const email = $('email').value.trim().toLowerCase(), password = $('password').value;
  const err = (m) => { $('loginErr').textContent = m; };
  if (!validEmail(email)) return err('Enter a valid email address.');
  if (password.length < 8) return err('Passwords have 8 or more characters.');
  err(''); $('loginBtn').disabled = true;
  const { data, error } = loginMode === 'signup'
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if ($('loginBtn')) $('loginBtn').disabled = false;
  if (error) {
    const m = error.message || '';
    if (/database error/i.test(m)) return err(NOT_TEAM);  // blocked by only_team_signups in setup.sql
    if (/already registered|already exists/i.test(m)) return err('You already set a password. Tap "Sign in" instead.');
    if (/invalid login/i.test(m)) return err('Wrong email or password. First time here? Tap "Set your password".');
    if (/not confirmed/i.test(m)) return err('This account is waiting for email confirmation. Ask an admin to turn off "Confirm email" in Supabase.');
    return err(errText(error));
  }
  if (!data.session) return err('This account is waiting for email confirmation. Ask an admin to turn off "Confirm email" in Supabase.');
  loginMode = 'signin';
  await enter(email);
}
async function signOut(msg) {
  try { await sb.auth.signOut(); } catch (e) {}
  db = emptyDb(); flow = null;
  await go('login');
  if (typeof msg === 'string') $('loginErr').textContent = msg;
}
function startFlow(dir) { flow = { dir, type: null, eventId: null, donor: '', lines: [], current: null }; go('type'); }
function pickType(t) { flow.type = t; flow.eventId = null; go(t === 'event' ? 'event' : t === 'donor' ? 'donor' : 'scan'); }
function pickEvent(id) { flow.eventId = id; go('scan'); }
function submitDonor() {
  const n = $('donorName').value.trim();
  if (!n) { $('donorErr').textContent = 'Enter the donor\'s name.'; return; }
  flow.donor = n; go('scan');
}
async function submitRequest() {
  const name = $('rqName').value.trim();
  if (!name) { $('rqErr').textContent = 'Enter the event name.'; return; }
  if (await change(sb.from('event_requests').insert({ name, event_date: $('rqDate').value || null }).select(), 'Request sent. You can pick the event once an admin adds it.')) go('event');
}
async function cancelFlow() {
  if (flow.lines.length && !(await ask('Cancel and discard the items you scanned?', 'Discard'))) return;
  flow = null; go('home');
}
// includeDeleted: codes of deleted items are never handed out again, so old labels can't point at a new item.
function findItem(code, includeDeleted) {
  const c = String(code).trim().toLowerCase();
  return db.items.find((i) => (includeDeleted || !i.deleted) && i.code.toLowerCase() === c);
}
async function onCode(text) {
  if (handling || !text) return;
  handling = true;
  const it = findItem(text);
  if (!it) { toast(`No item has the code "${text}".`); setTimeout(() => { handling = false; }, 1500); return; }
  if ('vibrate' in navigator) navigator.vibrate(60);
  flow.current = { itemId: it.id, qty: 1, donor: flow.donor || '' };
  await go('item');
  handling = false;
}
function startScanner() {
  if (!window.Html5Qrcode) { $('camMsg').textContent = 'The scanner did not load (no internet?). Type the code instead.'; return; }
  scanner = new Html5Qrcode('reader', { verbose: false });
  scanner.start({ facingMode: 'environment' },
    { fps: 10, qrbox: (w, hgt) => { const s = Math.floor(Math.min(w, hgt) * 0.7); return { width: s, height: s }; } },
    (text) => onCode(text), () => {})
    .catch(() => {
      scanner = null;
      if (!$('camMsg')) return; // already left the scan screen
      $('camMsg').textContent = 'The camera is blocked. Allow camera access for this site in your browser settings, or take a photo instead.'; $('reader').hidden = true;
    });
}
async function scanPhoto(input) {
  const file = input.files && input.files[0]; input.value = '';
  if (!file) return;
  if (!window.Html5Qrcode) { toast('The scanner did not load. Type the code instead.'); return; }
  const text = await decodePhoto(file);
  if (text) onCode(text); else toast('No code found in that photo. Fill the frame with the label and try again.');
}
// Phone photos are 12+ megapixels and the decoder gives up on them, so try smaller copies and a centre crop.
async function decodePhoto(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });
  URL.revokeObjectURL(url);
  if (!img) return null;
  const W = img.naturalWidth, H = img.naturalHeight;
  const tries = [[0, 0, W, H, 1200], [W * .2, H * .2, W * .6, H * .6, 1000], [0, 0, W, H, 800], [0, 0, W, H, 1800]];
  const reader = new Html5Qrcode('fileReader', { verbose: false });
  try {
    for (const [sx, sy, sw, sh, max] of tries) {
      const k = Math.min(1, max / Math.max(sw, sh));
      const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      if ('BarcodeDetector' in window) {
        try { const r = await new BarcodeDetector().detect(c); if (r[0]) return r[0].rawValue; } catch (e) {}
      }
      const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
      try { return await reader.scanFile(new File([blob], 'scan.png', { type: 'image/png' }), false); } catch (e) {}
    }
    return null;
  } finally { try { reader.clear(); } catch (e) {} }
}
function bump(d) { const i = $('qtyInput'); i.value = Math.max(1, (parseInt(i.value, 10) || 0) + d); }
function addLine(finish) {
  const qty = parseInt($('qtyInput').value, 10);
  const c = flow.current, it = item(c.itemId);
  const err = (m) => { $('itemErr').textContent = m; };
  if (!qty || qty < 1) return err('Enter a quantity of 1 or more.');
  const donor = flow.type === 'donor' ? $('lineDonor').value.trim() : '';
  if (flow.type === 'donor' && !donor) return err('Enter the donor this item is for.');
  if (flow.dir === 'out') {
    const inCart = flow.lines.filter((l) => l.itemId === it.id).reduce((s, l) => s + l.qty, 0);
    if (qty + inCart > it.qty) return err(`Only ${it.qty - inCart} left in stock.`);
  }
  const same = flow.lines.find((l) => l.itemId === it.id && l.donor === donor);
  if (same) same.qty += qty; else flow.lines.push({ itemId: it.id, qty, donor });
  flow.current = null;
  if (finish) complete(); else go('scan');
}
function removeLine(idx) { flow.lines.splice(idx, 1); render(); if (view === 'scan') { stopScanner().then(startScanner); } }
async function complete() {
  if (!flow.lines.length) { toast('Scan at least one item first.'); return; }
  if (busy) return;   // a double tap on Done must not record the checkout twice
  busy = true;
  const { data: txId, error } = await sb.rpc('record_transaction', {
    p_dir: flow.dir, p_type: flow.type, p_event_id: flow.eventId ? Number(flow.eventId) : null, p_donor: flow.donor || '',
    p_lines: flow.lines.map((l) => ({ item_id: Number(l.itemId), qty: l.qty, donor: l.donor })),
  });
  busy = false;
  if (error) {
    try { await loadAll(); } catch (e) {}
    await go('scan');   // nothing was saved; the list is still there to fix
    toast(errText(error));
    return;
  }
  const local = { id: String(txId), dir: flow.dir, type: flow.type, eventId: flow.eventId, donor: flow.donor || '', user: db.session, at: new Date().toISOString(), lines: flow.lines.map((l) => ({ ...l })) };
  try { await loadAll(); } catch (e) {}
  lastTx = db.tx.find((t) => t.id === String(txId)) || local;
  flow = null; go('success');
}
async function requestClose(id) {
  await change(sb.rpc('request_event_close', { p_event_id: Number(id) }), 'Close request sent to the admin.');
}

async function addItem() {
  const name = $('niName').value.trim(), location = $('niLoc').value.trim(), qty = parseInt($('niQty').value, 10);
  let code = $('niCode').value.trim();
  if (!name || !location || isNaN(qty) || qty < 0) { $('niErr').textContent = 'Fill in name, location and a quantity of 0 or more.'; return; }
  if (code && findItem(code, true)) { $('niErr').textContent = 'Another item already uses that code.'; return; }
  if (!code) { let n = db.items.length + 1; do { code = 'AF-' + String(n++).padStart(4, '0'); } while (findItem(code, true)); }
  await change(sb.from('items').insert({ code, name, location, qty }).select(), `Added ${name} (${code}).`);
}
async function editItem(id, field, value) {
  let v;
  if (field === 'qty') { v = parseInt(value, 10); if (isNaN(v) || v < 0) { toast('Quantity must be 0 or more.'); render(); return; } }
  else {
    v = value.trim();
    if (!v) { toast(field === 'name' ? 'The name can\'t be empty.' : 'The location can\'t be empty.'); render(); return; }
  }
  await change(sb.from('items').update({ [field]: v }).eq('id', Number(id)).select(), 'Saved.');
}
async function deleteItem(id) {
  const it = item(id);
  if (!(await ask(`Delete ${it.name}? It disappears from the inventory and can't be scanned. Past check-outs still show it.`, 'Delete'))) return;
  await change(sb.from('items').update({ deleted: true }).eq('id', Number(id)).select(), `Deleted ${it.name}.`);
}
async function addEvent() {
  const name = $('neName').value.trim(); if (!name) return;
  await change(sb.from('events').insert({ name, event_date: $('neDate').value || null }).select(), `Created ${name}.`);
}
async function approveRequest(id) {
  const r = db.requests.find((x) => x.id === id);
  if (await change(sb.from('events').insert({ name: r.name, event_date: r.date || null }).select(), `Added ${r.name}.`))
    await change(sb.from('event_requests').delete().eq('id', Number(id)).select());
}
async function dismissRequest(id) { await change(sb.from('event_requests').delete().eq('id', Number(id)).select()); }
async function setEvent(id, status) {
  if (status === 'closed') {
    const out = Object.values(eventOutstanding(id)).reduce((s, n) => s + Math.max(n, 0), 0);
    if (out && !(await ask(`${out} item(s) are still out for this event. Close it anyway?`, 'Close event'))) return;
  }
  const patch = status === 'open' ? { status, close_requested_by: null } : { status };
  await change(sb.from('events').update(patch).eq('id', Number(id)).select());
}
async function addMember() {
  const email = $('nmEmail').value.trim().toLowerCase(), admin = $('nmAdmin').checked;
  if (!validEmail(email)) { $('nmErr').textContent = 'Enter a valid email address.'; return; }
  if (member(email)) { $('nmErr').textContent = `${email} is already on the team.`; return; }
  await change(sb.from('members').insert({ email, is_admin: admin }).select(), `Added ${email} as ${admin ? 'an admin' : 'a member'}. They can now open the app and tap "Set your password".`);
}
async function setRole(i, role) {
  const m = db.members[i];
  if (role === 'member' && m.admin && adminCount() === 1) { toast('The team needs at least one admin.'); render(); return; }
  if (role === 'member' && m.email === db.session && !(await ask('Remove your own admin access? You will no longer see the Admin area.', 'Remove my access'))) { render(); return; }
  await change(sb.from('members').update({ is_admin: role === 'admin' }).eq('email', m.email).select(), `${m.email} is now ${role === 'admin' ? 'an admin' : 'a member'}.`);
  if (!isAdmin()) go('home');
}
async function removeMember(i) {
  const m = db.members[i];
  if (m.admin && adminCount() === 1) { toast('The team needs at least one admin.'); return; }
  const self = m.email === db.session;
  if (!(await ask(self ? 'Remove yourself from the team? You will be signed out and can\'t sign back in.' : `Remove ${m.email}? They won't be able to sign in. Their past check-outs stay in the history.`, 'Remove'))) return;
  await change(sb.from('members').delete().eq('email', m.email).select(), `Removed ${m.email}.`);
}
function exportCsv() {
  const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date', 'Person', 'Direction', 'Type', 'Event', 'Donor', 'Item', 'Code', 'Quantity']];
  for (const t of db.tx) for (const l of t.lines) {
    const it = item(l.itemId);
    rows.push([t.at, t.user, t.dir === 'out' ? 'Check-out' : 'Check-in', TYPES[t.type].label, t.eventId ? ev(t.eventId)?.name : '', l.donor || t.donor, it?.name, it?.code, l.qty]);
  }
  saveFile('atlas-free-inventory-activity.csv', rows.map((r) => r.map(esc).join(',')).join('\n'), 'text/csv');
}
function downloadLabels() {
  const cells = active().map((i) => `<div class="l"><img src="${qrUrl(i.code)}" alt=""><b>${h(i.name)}</b><span>${h(i.code)}</span></div>`).join('');
  const doc = `<!doctype html><html><head><meta charset="utf-8"><title>Atlas Free QR labels</title><style>
body{font-family:system-ui,sans-serif;margin:16px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.l{border:1px dashed #bbb;border-radius:6px;padding:8px;text-align:center;break-inside:avoid}.l img{width:110px;height:110px;image-rendering:pixelated}
.l b{display:block;font-size:13px}.l span{font-size:11px;color:#555}@media print{.l{border-color:#ddd}}</style></head>
<body><p>Open this file and print it (Cmd+P / Ctrl+P) on sticker paper.</p><div class="g">${cells}</div></body></html>`;
  saveFile('atlas-free-qr-labels.html', doc, 'text/html');
}

boot();
</script>
